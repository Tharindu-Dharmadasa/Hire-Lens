services:
  postgres:
    image: postgres:16-alpine
    container_name: hirelens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hirelens_db
      POSTGRES_USER: hirelens
      POSTGRES_PASSWORD: hirelens123
    ports:
      - "5432:5432"
    volumes:
      - hirelens_postgres_data:/var/lib/postgresql/data

volumes:
  hirelens_postgres_data:
